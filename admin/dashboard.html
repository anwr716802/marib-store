<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة المتجر</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <style>
        /* منطقة Debug */
        #debugArea {
            margin: 20px;
            padding: 15px;
            background: #1e1e1e;
            color: #0f0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
        #debugToggle {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 2000;
        }
        .debug-entry {
            border-bottom: 1px solid #333;
            padding: 4px 0;
        }
        .debug-error { color: #ff5555; }
        .debug-success { color: #55ff55; }
        .debug-info { color: #aaa; }
    </style>
</head>
<body class="admin-body">
    <button id="debugToggle" onclick="toggleDebug()">إظهار سجل التصحيح</button>

    <!-- الهيدر والألسنة (نفس الهيكل السابق) -->
    <div class="admin-header">
        <h1>لوحة التحكم</h1>
        <button onclick="logout()" class="btn-logout">تسجيل الخروج</button>
    </div>
    <div class="admin-tabs">
        <button class="tab-btn active" onclick="showTab('products')">المنتجات</button>
        <button class="tab-btn" onclick="showTab('services')">الخدمات</button>
        <button class="tab-btn" onclick="showTab('categories')">الأقسام</button>
        <button class="tab-btn" onclick="showTab('settings')">الإعدادات</button>
        <button class="tab-btn" onclick="showTab('gallery')">المعرض</button>
        <button class="tab-btn" onclick="showTab('pages')">الصفحات</button>
    </div>

    <!-- تبويب المنتجات -->
    <div class="tab-content" id="tab-products">
        <h2>المنتجات</h2>
        <button class="btn-primary" onclick="openProductForm()">➕ إضافة منتج</button>
        <div id="productsList" class="list-container"></div>

        <!-- نموذج إضافة/تعديل منتج -->
        <div id="productFormModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeProductForm()">&times;</span>
                <h3 id="productFormTitle">إضافة منتج جديد</h3>
                <form id="productForm">
                    <input type="hidden" id="prodId">
                    <label>اسم المنتج</label>
                    <input type="text" id="prodName" required>
                    <label>التصنيف</label>
                    <select id="prodCategory"></select>
                    <label>السعر (ريال)</label>
                    <input type="number" id="prodPrice">
                    <label>الوصف</label>
                    <textarea id="prodDesc" rows="3"></textarea>
                    <label>رقم الواتساب للطلب</label>
                    <input type="text" id="prodWhatsapp" placeholder="967xxxxxxxxx">
                    <label>صورة المنتج</label>
                    <div class="image-upload-area">
                        <input type="file" id="prodImageFile" accept="image/*">
                        <button type="button" id="uploadProdImageBtn" class="btn-secondary">رفع الصورة</button>
                        <div class="progress"><progress id="prodUploadProgress" value="0" max="100" style="display:none; width:100%;"></progress></div>
                        <img id="prodImagePreview" src="#" alt="معاينة" style="display:none; max-width:200px;">
                        <input type="hidden" id="prodImageUrl">
                    </div>
                    <button type="submit" class="btn-primary">حفظ</button>
                </form>
            </div>
        </div>
    </div>

    <!-- تبويبات أخرى (اختصار) -->
    <div class="tab-content" id="tab-services" style="display:none;"><h2>الخدمات</h2></div>
    <div class="tab-content" id="tab-categories" style="display:none;"><h2>الأقسام</h2></div>
    <div class="tab-content" id="tab-settings" style="display:none;"><h2>الإعدادات</h2></div>
    <div class="tab-content" id="tab-gallery" style="display:none;"><h2>المعرض</h2></div>
    <div class="tab-content" id="tab-pages" style="display:none;"><h2>الصفحات</h2></div>

    <!-- منطقة Debug -->
    <div id="debugArea"></div>

    <script src="script.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
